<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - QC Inspection System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #123b65;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin: 10px 0 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #123b65;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #pesan {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <h1>QC Inspection System</h1>
    <p class="subtitle">Silakan login untuk melanjutkan</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

      <p id="pesan" role="status"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const pesan = document.getElementById("pesan");
    const tombol = document.getElementById("loginButton");

    document.getElementById("loginForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        tombol.disabled = true;
        pesan.textContent = "Sedang memproses login...";

        try {
          if (
            typeof SUPABASE_URL === "undefined" ||
            typeof SUPABASE_PUBLISHABLE_KEY === "undefined" ||
            !window.supabase
          ) {
            throw new Error(
              "Konfigurasi Supabase belum tersedia."
            );
          }

          const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

          const { error } = await client.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          });

          if (error) throw error;

          pesan.style.color = "green";
          pesan.textContent =
            "Login berhasil! Koneksi autentikasi sudah berfungsi. Dashboard akan dibuat pada tahap berikutnya.";

        } catch (error) {
          pesan.style.color = "#b91c1c";
          pesan.textContent =
            "Login gagal: " + error.message;
        } finally {
          tombol.disabled = false;
        }
      });
  </script>

</body>
</html>
